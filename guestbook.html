<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гостевая — Игорь</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#ffd92f;color:#0645ad}.wrap{width:min(760px,92%);margin:auto;padding:50px 0}.card{background:#fff4a8;border:1px solid rgba(0,70,170,.18);border-radius:22px;padding:28px}h1{text-align:center;font-size:44px;margin:0 0 15px}p{line-height:1.6}.back{display:inline-block;margin-bottom:25px;padding:12px 18px;border-radius:12px;background:#0645ad;color:#fff;text-decoration:none;font-weight:700}input,textarea{width:100%;padding:14px;margin:7px 0 15px;border:1px solid rgba(0,70,170,.25);border-radius:12px;font:inherit}textarea{min-height:130px;resize:vertical}button{padding:14px 22px;border:0;border-radius:12px;background:#0645ad;color:#fff;font-size:17px;font-weight:700;cursor:pointer}.message{background:#fff;border-radius:14px;padding:14px;margin:12px 0;color:#111;white-space:pre-wrap}.ok{display:none;margin-top:16px;font-weight:700}
</style>
</head>
<body><div class="wrap">
<a class="back" href="index.html">← На главную</a>
<div class="card">
<h1>Гостевая</h1>
<p>Оставьте своё имя и сообщение.</p>
<form id="guestForm">
<label>Имя</label><input id="name" type="text" placeholder="Ваше имя" required>
<label>Сообщение</label><textarea id="message" placeholder="Ваше сообщение" required></textarea>
<button type="submit">Оставить сообщение</button>
<div id="ok" class="ok">Сообщение добавлено!</div>
</form>
<div id="messages"></div>
</div></div>
<script>
const KEY='house_guestbook_messages';
function load(){
 const box=document.getElementById('messages');
 const arr=JSON.parse(localStorage.getItem(KEY)||'[]');
 box.innerHTML=arr.map(x=>'<div class="message"><b>'+escapeHtml(x.name)+'</b><br>'+escapeHtml(x.message)+'</div>').join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
document.getElementById('guestForm').addEventListener('submit',function(e){
 e.preventDefault();
 const name=document.getElementById('name').value.trim();
 const message=document.getElementById('message').value.trim();
 if(!name||!message)return;
 const arr=JSON.parse(localStorage.getItem(KEY)||'[]');
 arr.unshift({name,message});
 localStorage.setItem(KEY,JSON.stringify(arr.slice(0,100)));
 document.getElementById('message').value='';
 document.getElementById('ok').style.display='block';
 load();
 setTimeout(()=>document.getElementById('ok').style.display='none',2500);
});
load();
</script>
</body></html>
