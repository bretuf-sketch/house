<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игорь — мой сайт</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #172033;
}

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  width: min(720px, 100%);
  background: white;
  border-radius: 24px;
  padding: 48px 32px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,.08);
}

h1 {
  font-size: clamp(36px, 8vw, 58px);
  margin: 0 0 16px;
}

p {
  font-size: 18px;
  line-height: 1.6;
  color: #5d6677;
  margin: 0 auto 28px;
  max-width: 560px;
}

.button {
  display: inline-block;
  padding: 14px 24px;
  border-radius: 12px;
  background: #24292f;
  color: white;
  text-decoration: none;
}

footer {
  margin-top: 28px;
  font-size: 13px;
  color: #8a93a3;
}
</style>
</head>

<body>

<main>
  <section class="card">
    <h1>Добро пожаловать</h1>

    <p>
      Это мой новый сайт.
      Здесь скоро появится основная информация
      и нужные разделы.
    </p>

    <a class="button" href="mailto:bretuf@gmail.com">
      Связаться
    </a>

    <footer>
      © 2026
    </footer>
  </section>
</main>

</body>
</html>
